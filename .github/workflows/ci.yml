name: CI

on:
  push:
    paths:
      - 'playbooks/**'
      - 'templates/**'
      - 'ansible.cfg'
      - '.github/workflows/ci.yml'
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install "ansible-core" "ansible-lint" "yamllint"

      - name: Install RouterOS collection
        run: ansible-galaxy collection install community.routeros

      - name: yamllint
        run: |
          yamllint -d '{extends: relaxed, rules: {line-length: disable}}' playbooks/

      - name: Syntax check
        run: |
          for pb in playbooks/*.yml; do
            echo "--- $pb"
            ansible-playbook --syntax-check -i inventory.ini "$pb"
          done

      - name: ansible-lint
        run: ansible-lint playbooks/ || true